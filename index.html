<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chronographs</title>
<meta name="description" content="Chronographs: a series of interactive histories, each told along a single line through time.">
<meta property="og:title" content="Chronographs">
<meta property="og:description" content="History told along a single line.">
<meta property="og:image" content="https://julianlee314-hue.github.io/chronographs/img/dow.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f3f5f1'/%3E%3Cpath d='M5 22 L11 17 L15 19 L21 11 L27 8' fill='none' stroke='%2314231c' stroke-width='2.2' stroke-linejoin='round'/%3E%3Ccircle cx='21' cy='11' r='3' fill='%231f5c43'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #f3f5f1;
  --panel: #fbfcfa;
  --ink: #14231c;
  --ink-2: #44554c;
  --muted: #6f7f77;
  --rule: #d5dcd4;
  --accent: #1f5c43;
  --accent-soft: #e2ebe4;
  --band: #e6ebe4;
  --c-war: #eb6834;
  --c-crisis: #b3261e;
  --c-gold: #c9a227;
  --c-notes: #2a78d6;
  --c-markets: #5b4bc4;
  --c-institution: #1baf7a;
  --f-display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-body: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.125rem;
  --step-2: 1.5rem;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1612; --panel: #151e19; --ink: #e6ede8; --ink-2: #b2c0b7; --muted: #82938a;
    --rule: #28352e; --accent: #82c9a6; --accent-soft: #1c2b23; --band: #18231d;
    --c-war: #d95926; --c-crisis: #f07167; --c-gold: #d4b84a; --c-notes: #3987e5;
    --c-markets: #8b7ae8; --c-institution: #199e70;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: var(--step-0); line-height: 1.55;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 48px 16px 40px; display: grid; gap: 44px; }
@media (min-width: 720px) { .wrap { padding: 72px 32px 48px; gap: 56px; } }

/* Masthead */
.mast { display: grid; justify-items: center; text-align: center; gap: 10px; }
.eyebrow { font-family: var(--f-mono); font-size: var(--step--1); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; }
.wordmark {
  font-family: var(--f-display); font-weight: 500; margin: 6px 0 0;
  font-size: clamp(2rem, 9.1vw, 5.75rem); line-height: 1; letter-spacing: 0.07em;
  padding-left: 0.07em; /* optically balance the trailing letter-space */
}
.sub { font-family: var(--f-display); font-style: italic; font-size: clamp(1.15rem, 3.4vw, 1.6rem); color: var(--accent); margin: 0; text-wrap: balance; }
.spine { width: min(560px, 100%); height: auto; margin-top: 14px; display: block; overflow: visible; }
.spine .axis { stroke: var(--ink); stroke-width: 1.2; }
.spine .tick { stroke: var(--muted); stroke-width: 1; }
.spine .line { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; opacity: 0.85; }
.spine .dot { stroke: var(--bg); stroke-width: 1.6; }

/* Contents */
.contents { display: grid; gap: 18px; }
.contents-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-bottom: 1px solid var(--rule); padding-bottom: 10px; }
h2 { font-family: var(--f-display); font-weight: 500; font-size: var(--step-2); margin: 0; }
.count { font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.grid { list-style: none; margin: 0; padding: 0; display: grid; gap: 22px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.grid > li { display: grid; min-width: 0; }

.cg {
  display: grid; grid-template-rows: auto 1fr; min-width: 0;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden;
  color: inherit; text-decoration: none;
  transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
}
a.cg:hover { border-color: var(--muted); transform: translateY(-2px); box-shadow: 0 10px 28px rgb(0 0 0 / 0.08); }
a.cg:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.thumb { margin: 0; aspect-ratio: 16 / 10; background: var(--band); border-bottom: 1px solid var(--rule); overflow: hidden; position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
a.cg:hover .thumb img { transform: scale(1.025); }
.body { display: grid; gap: 8px; align-content: start; padding: 16px 18px 18px; }
.meta { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-family: var(--f-mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.meta .span { color: var(--ink-2); font-variant-numeric: lining-nums tabular-nums; letter-spacing: 0.04em; }
.title { font-family: var(--f-display); font-weight: 500; font-size: var(--step-2); line-height: 1.15; margin: 0; text-wrap: balance; }
.blurb { margin: 0; color: var(--ink-2); }
.open { margin-top: 4px; font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
a.cg:hover .open .arr { transform: translateX(3px); }
.open .arr { display: inline-block; transition: transform .18s ease; }

/* Coming soon */
.cg.soon { background: transparent; border-style: dashed; opacity: 0.85; }
.cg.soon .thumb { background: repeating-linear-gradient(135deg, transparent 0 9px, var(--band) 9px 10px); border-bottom-style: dashed; display: grid; place-items: center; aspect-ratio: 16 / 6; }
.cg.soon .thumb svg { width: 52%; }
.cg.soon .thumb svg { height: auto; opacity: 0.5; }
.cg.soon .thumb svg path { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 3 4; }
.cg.soon .title { color: var(--muted); }
.badge { font-family: var(--f-mono); font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; border: 1px solid var(--rule); border-radius: 999px; padding: 3px 9px; color: var(--muted); background: var(--bg); }

.note { font-family: var(--f-mono); color: var(--muted); padding: 24px 0; }

footer { border-top: 1px solid var(--rule); padding-top: 16px; font-size: var(--step--1); color: var(--muted); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }
footer p { margin: 0; }
footer a { color: var(--ink-2); text-underline-offset: 2px; }
footer .repos a + a::before { content: "·"; color: var(--muted); margin: 0 8px; display: inline-block; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="wrap">
  <header class="mast">
    <p class="eyebrow">A series of histories</p>
    <h1 class="wordmark">CHRONOGRAPHS</h1>
    <p class="sub">History told along a single line.</p>
    <svg class="spine" viewBox="0 0 560 34" aria-hidden="true" id="spine"></svg>
  </header>

  <section class="contents" aria-labelledby="contents-h">
    <div class="contents-head">
      <h2 id="contents-h">Contents</h2>
      <span class="count" id="count"></span>
    </div>
    <ul class="grid" id="grid">
      <li class="note" id="boot">Loading…</li>
    </ul>
    <noscript>
      <ul>
        <li><a href="https://julianlee314-hue.github.io/dow-timeline/v0.2/">The Dow, 1896–2026</a></li>
        <li><a href="https://julianlee314-hue.github.io/the-bank-1694/">The Bank, 1694–1994</a></li>
        <li><a href="https://julianlee314-hue.github.io/ww2-strat-map/">World War Two, Week by Week, 1939–1945</a></li>
      </ul>
    </noscript>
  </section>

  <footer>
    <p>Chronographs is a series by Julius. Each Chronograph credits its own sources and archive images.</p>
    <p class="repos" id="repos"></p>
  </footer>
</main>

<script>
(function () {
  // Decorative time spine: an axis, ticks, a small wandering line, three event dots.
  const svg = document.getElementById("spine");
  const NS = "http://www.w3.org/2000/svg";
  const el = (n, a) => { const e = document.createElementNS(NS, n); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };
  el("line", { class: "axis", x1: 0, y1: 28, x2: 560, y2: 28 });
  for (let i = 0; i <= 40; i++) {
    const x = i * 14; const big = i % 10 === 0;
    el("line", { class: "tick", x1: x, y1: 28, x2: x, y2: big ? 34 : 31 });
  }
  const pts = [[0,22],[40,20],[70,23],[110,17],[150,19],[190,12],[215,21],[250,16],[300,14],[340,18],[380,9],[420,12],[470,7],[520,8],[560,3]];
  el("path", { class: "line", d: "M" + pts.map(p => p.join(",")).join(" L") });
  [[190,12,"--c-war"],[380,9,"--c-notes"],[470,7,"--c-gold"]].forEach(([x,y,c]) =>
    el("circle", { class: "dot", cx: x, cy: y, r: 4, style: `fill: var(${c})` }));
})();

const ROMAN = n => [[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]].reduce((s,[v,r]) => { while (n >= v) { s += r; n -= v; } return s; }, "");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function card(c, i) {
  const no = "No. " + ROMAN(i + 1);
  if (c.status !== "live") {
    return `<li><div class="cg soon" aria-label="${esc(c.title)}, coming soon">
      <div class="thumb"><svg viewBox="0 0 200 80" aria-hidden="true"><path d="M2 70 L30 60 L52 64 L80 44 L104 50 L130 30 L158 34 L198 10"/></svg></div>
      <div class="body">
        <div class="meta"><span>${no}</span><span class="badge">Coming soon</span></div>
        <h3 class="title">${esc(c.title)}</h3>
        ${c.blurb ? `<p class="blurb">${esc(c.blurb)}</p>` : ""}
      </div></div></li>`;
  }
  return `<li><a class="cg" href="${esc(c.url)}">
    <figure class="thumb">${c.thumb ? `<img src="${esc(c.thumb)}" alt="" loading="lazy" width="600" height="375">` : ""}</figure>
    <div class="body">
      <div class="meta"><span>${no}</span><span class="span">${esc(c.span)}</span></div>
      <h3 class="title">${esc(c.title)}</h3>
      <p class="blurb">${esc(c.blurb)}</p>
      <span class="open">Open <span class="arr">→</span></span>
    </div></a></li>`;
}

fetch("data/chronographs.json", { cache: "no-cache" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    const list = d.chronographs || [];
    document.getElementById("grid").innerHTML = list.map(card).join("");
    const live = list.filter(c => c.status === "live").length, soon = list.length - live;
    document.getElementById("count").textContent = `${live} live` + (soon ? ` · ${soon} coming` : "");
    const repos = list.filter(c => c.repo).map(c => `<a href="${esc(c.repo)}">${esc(c.repo.split("/").pop())}</a>`);
    repos.push(`<a href="https://github.com/julianlee314-hue/chronographs">chronographs</a>`);
    document.getElementById("repos").innerHTML = repos.join("");
  })
  .catch(err => {
    document.getElementById("grid").innerHTML = `<li class="note">Could not load data/chronographs.json (${esc(err.message)}). Serve over http or open on GitHub Pages.</li>`;
  });
</script>
</body>
</html>
